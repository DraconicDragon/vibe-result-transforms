[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibe-result-transforms"
version = "0.1.0"
description = "Post-processing and result transform pipeline for vibe vision models."
readme = "README.md"
license = "MIT"
authors = [{ name = "Drac" }]
requires-python = ">=3.11"
dependencies = [ #"vibe<1.0.1", 
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "pytest-cov>=4.1", "ruff", "ty"]

# Explicitly tell Hatchling the package lives at the root
[tool.hatch.build.targets.wheel]
packages = ["vibe_result_transforms"]


[tool.pytest.ini_options]
testpaths = ["tests"]
